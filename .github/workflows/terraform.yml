name: "CI/CD Pipeline - Achados e Perdidos"

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  FLUTTER_VERSION: '3.35.5'
  JAVA_VERSION: '25'
  TERRAFORM_VERSION: '1.6.0'
  AWS_REGION: 'sa-east-1'

jobs:
  # Job 3: Terraform Plan (PRs e Dev)
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Determine Environment
        id: env-setup
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prd" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Unlock orphaned locks for branch
        run: |
          LOCKS=$(aws dynamodb scan \
            --table-name state-sa-east-1-github-aep \
            --query "Items[?contains(LockID.S, '${{ steps.env-setup.outputs.environment }}')].LockID.S" \
            --output text)
          if [ -n "$LOCKS" ]; then
            for LOCK in $LOCKS; do
              echo "Liberando lock órfão $LOCK..."
              terraform force-unlock -force $LOCK || echo "Não foi possível liberar $LOCK"
            done
          else
            echo "Nenhum lock órfão encontrado para ${{ steps.env-setup.outputs.environment }}."
          fi
        working-directory: ./terraform

      - name: Terraform Init
        run: terraform init -backend-config="envs/${{ steps.env-setup.outputs.environment }}/backend.tfvars"
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="envs/${{ steps.env-setup.outputs.environment }}/terraform.tfvars" \
            -out=tfplan-${{ steps.env-setup.outputs.environment }}
        working-directory: ./terraform

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ steps.env-setup.outputs.environment }}
          path: terraform/tfplan-${{ steps.env-setup.outputs.environment }}

  # Job 4: Terraform Apply (apenas main / produção)
  terraform-apply:
    name: "Terraform Apply Production"
    runs-on: ubuntu-latest
    needs: [terraform-plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init -backend-config="envs/prd/backend.tfvars"
        working-directory: ./terraform

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-prd
          path: terraform/

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan-prd
        working-directory: ./terraform

  # Job 5: Deploy para Dev (automático)
  deploy-dev:
    name: "Deploy to Development"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Unlock orphaned locks for dev branch
        run: |
          LOCKS=$(aws dynamodb scan \
            --table-name state-sa-east-1-github-aep \
            --query "Items[?contains(LockID.S, 'dev')].LockID.S" \
            --output text)
          if [ -n "$LOCKS" ]; then
            for LOCK in $LOCKS; do
              echo "Liberando lock órfão $LOCK..."
              terraform force-unlock -force $LOCK || echo "Não foi possível liberar $LOCK"
            done
          else
            echo "Nenhum lock órfão encontrado para dev."
          fi
        working-directory: ./terraform

      - name: Terraform Init
        run: terraform init -backend-config="envs/dev/backend.tfvars"
        working-directory: ./terraform

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="envs/dev/terraform.tfvars" \
            -out=tfplan-dev
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan-dev
        working-directory: ./terraform

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: flutter-builds
          path: ./builds/

      - name: Deploy to S3 (Dev)
        run: |
          BUCKET_NAME=$(terraform output -raw frontend_bucket_name)
          aws s3 sync ./builds/web/ s3://$BUCKET_NAME/ --delete
          echo "🚀 Frontend deployed to Development environment: $BUCKET_NAME"
        working-directory: ./terraform
