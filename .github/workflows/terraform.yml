name: "CI/CD Pipeline - Achados e Perdidos"

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  FLUTTER_VERSION: '3.35.5'
  JAVA_VERSION: '25'
  TERRAFORM_VERSION: '1.6.0'
  AWS_REGION: 'us-east-1'

jobs:
  # Job 1: Build e Test do Frontend Flutter
  build-frontend:
    name: "Build Frontend Flutter"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v
        working-directory: ./flutter

      - name: Get Flutter Dependencies
        run: flutter pub get
        working-directory: ./flutter
      
      - name: Run Flutter Analyzer
        run: flutter analyze --no-fatal-infos
        working-directory: ./flutter

      - name: Run Flutter Tests
        run: flutter test
        working-directory: ./flutter

      - name: Build Flutter Web
        run: |
          flutter build web --release
        working-directory: ./flutter

      - name: Build Flutter APK
        run: flutter build apk --release
        working-directory: ./flutter

      - name: Upload Flutter Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-builds
          path: |
            flutter/build/web/
            flutter/build/app/outputs/flutter-apk/

  # Job 3: Terraform Plan (PRs e Dev)
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: [build-frontend]   # Agora depende do build do Flutter
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Determine Environment
        id: env-setup
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prd" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Unlock orphaned locks for branch
        run: |
          LOCKS=$(aws dynamodb scan \
            --table-name state-us-east-1-github-aep \
            --query "Items[?contains(LockID.S, '${{ steps.env-setup.outputs.environment }}')].LockID.S" \
            --output text)
          if [ -n "$LOCKS" ]; then
            for LOCK in $LOCKS; do
              echo "Liberando lock órfão $LOCK..."
              terraform force-unlock -force $LOCK || echo "Lock já removido ou não existe"
            done
          else
            echo "Nenhum lock órfão encontrado para ${{ steps.env-setup.outputs.environment }}."
          fi
        working-directory: ./terraform

      - name: Terraform Init
        run: terraform init -backend-config="envs/${{ steps.env-setup.outputs.environment }}/backend.tfvars"
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="envs/${{ steps.env-setup.outputs.environment }}/terraform.tfvars" \
            -out=tfplan-${{ steps.env-setup.outputs.environment }}
        working-directory: ./terraform

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ steps.env-setup.outputs.environment }}
          path: terraform/tfplan-${{ steps.env-setup.outputs.environment }}

  # Job 5: Deploy para Dev (automático)
  deploy-dev:
    name: "Deploy to Development"
    runs-on: ubuntu-latest
    needs: [build-frontend, terraform-plan]   # Depende do build do Flutter e do plan do Terraform
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Unlock orphaned locks for dev branch
        run: |
          LOCKS=$(aws dynamodb scan \
            --table-name state-us-east-1-github-aep \
            --query "Items[?contains(LockID.S, 'dev')].LockID.S" \
            --output text)
          if [ -n "$LOCKS" ]; then
            for LOCK in $LOCKS; do
              echo "Liberando lock órfão $LOCK..."
              terraform force-unlock -force $LOCK || echo "Lock já removido ou não existe"
            done
          else
            echo "Nenhum lock órfão encontrado para dev."
          fi
        working-directory: ./terraform

      - name: Terraform Init
        run: terraform init -backend-config="envs/dev/backend.tfvars"
        working-directory: ./terraform

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="envs/dev/terraform.tfvars" \
            -out=tfplan-dev
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan-dev
        working-directory: ./terraform

      - name: Download Flutter Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: flutter-builds
          path: ./builds/

      - name: Deploy to S3 (Dev)
        run: |
          BUCKET_NAME=$(terraform output -raw frontend_bucket_name)
          aws s3 sync ../builds/web/ s3://$BUCKET_NAME/ --delete
          echo "🚀 Frontend deployed to Development environment: $BUCKET_NAME"
        working-directory: ./terraform

  # Job 6: Build e Deploy da API na EC2
  ec2-api-deploy:
    name: "Build & Deploy API to EC2"
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build JAR with Maven
        run: |
          cd fonte/api
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: fonte/api/target/*.jar
          retention-days: 30

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: (Info) Using default repo name
        run: |
          echo "Using ECR repository name: achados-e-perdidos-api"

      - name: Build Docker image
        run: |
          cd fonte/api
          docker build -t achados-api:latest .

      - name: Get AWS Account ID
        id: account
        run: |
          echo "account=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Login to ECR
        run: |
          REGION=${{ env.AWS_REGION }}
          ACCOUNT=${{ steps.account.outputs.account }}
          REPO_NAME=${{ github.event.repository.name }}-api
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin ${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com

      - name: Tag and Push image to ECR
        run: |
          REGION=${{ env.AWS_REGION }}
          ACCOUNT=${{ steps.account.outputs.account }}
          REPO=${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/achados-e-perdidos-api
          docker tag achados-api:latest ${REPO}:latest
          docker push ${REPO}:latest

      - name: Get EC2 Instance ID
        id: ec2-instance
        run: |
          # Obtém o ID da instância EC2 pela tag Name
          EC2_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=achados-api-dev" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)
          
          if [ -z "$EC2_ID" ]; then
            echo "Nenhuma instância EC2 encontrada com a tag 'Name=achados-api-dev'"
            exit 0
          fi
          
          echo "instance_id=$EC2_ID" >> $GITHUB_OUTPUT
          echo "Instância EC2 encontrada: $EC2_ID"

      - name: Trigger Docker container update on EC2
        run: |
          EC2_ID=${{ steps.ec2-instance.outputs.instance_id }}
          
          if [ -z "$EC2_ID" ]; then
            echo "Não foi possível encontrar a instância EC2."
            exit 0
          fi
          
          # Executa o script de atualização do container na instância EC2
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=$EC2_ID" \
            --parameters "commands=['/home/ec2-user/start-app.sh']" \
            --comment "Atualizar container da API"
          
          echo "Comando enviado para atualizar o container da API na instância EC2"
